# Backend-selection experiment: vLLM vs llama.cpp on Xeon Max (cache mode).
#
# Single source of truth for every parameter the scripts use. Paths may use
# ${VAR} references, expanded from the environment (configs/cresco8.env).
# Anything a run actually used is copied into that run's metadata.json, so this
# file can evolve without losing what a past run did.

schema_version = "1.0"
experiment = "backend-selection-v2"

# ---------------------------------------------------------------------------
# Hardware layout. Both backends get exactly the same socket, cores and memory
# node. The client, telemetry sampler and orchestrator run on the other socket
# so they neither steal cycles from the server nor touch socket-0 memory.
# ---------------------------------------------------------------------------
[topology]
memory_mode = "cache"            # HBM as memory-side cache in front of DDR
partition = "cresco8_hbm"        # cresco8-hbm01..13 are cache-mode nodes
socket = 0
server_cpus = "0-55"             # affinity of the whole server process tree
compute_cpus = "0-54"            # OpenMP compute threads, one per core
compute_threads = 55
frontend_cpu = 55                # left to the HTTP front end in both servers
server_mem_node = 0              # numactl --membind
server_cpu_node = 0              # NUMA node of the server cores (socket 0); vLLM binds its memory there itself
numa_shim = "${BC_DATA}/shim/numa_noop.so"   # LD_PRELOAD shim, loaded when server_mem_node != server_cpu_node (see numa_noop.c)
client_cpus = "100-111"          # socket 1
client_mem_node = 1

# ---------------------------------------------------------------------------
# Models. Same Hugging Face snapshot feeds both backends: vLLM reads the
# safetensors directly, llama.cpp reads GGUFs converted from that snapshot.
# ---------------------------------------------------------------------------
[models.llama31_8b]
hf_id = "meta-llama/Llama-3.1-8B-Instruct"
revision = "0e9e39f249a16976918f6564b8830bc894c89659"
snapshot = "${BC_HF_CACHE}/models--meta-llama--Llama-3.1-8B-Instruct/snapshots/0e9e39f249a16976918f6564b8830bc894c89659"
served_name = "llama31-8b"
params = 8.03e9
layers = 32
kv_heads = 8
head_dim = 128
hidden_size = 4096               # architecture (config.json of the snapshot), used by the roofline
intermediate_size = 14336        # operation model in src/llm_backend_analysis/analysis/roofline.py
attention_heads = 32
vocab_size = 128256
tied_embeddings = false
kv_bytes_per_token = 131072      # 32 layers * 8 kv heads * 128 * (K,V) * 2 B
weight_bytes_bf16 = 16060522496  # sum of safetensors tensor sizes
# Bytes one forward step streams: all tensors except the input-embedding table
# (only C rows of it are gathered); from file headers. w8a8 is filled from
# models/llama31_8b/w8a8-rtn/manifest.json after scripts/quantize_w8a8.py.
step_weight_bytes = { bf16 = 15009849344, q8_0 = 7974764800, w8a8 = 8033280000 }
bos_token_id = 128000
ordinary_vocab = 128000          # ids >= 128000 are special tokens
gguf_dir = "${BC_DATA}/models/llama31_8b"
gguf = { bf16 = "llama31-8b-instruct-bf16.gguf", q8_0 = "llama31-8b-instruct-q8_0.gguf" }
w8a8_dir = "${BC_DATA}/models/llama31_8b/w8a8-rtn"   # scripts/quantize_w8a8.py
primary = true

[models.llama32_1b]
hf_id = "meta-llama/Llama-3.2-1B-Instruct"
revision = "9213176726f574b556790deb65791e0c5aa438b6"
snapshot = "${BC_HF_CACHE}/models--meta-llama--Llama-3.2-1B-Instruct/snapshots/9213176726f574b556790deb65791e0c5aa438b6"
served_name = "llama32-1b"
params = 1.24e9
layers = 16
kv_heads = 8
head_dim = 64
hidden_size = 2048
intermediate_size = 8192
attention_heads = 32
vocab_size = 128256
tied_embeddings = true
kv_bytes_per_token = 32768       # 16 layers * 8 kv heads * 64 * (K,V) * 2 B
weight_bytes_bf16 = 2471628800
step_weight_bytes = { bf16 = 2471628800, q8_0 = 1313251456, w8a8 = 1499303936 }   # tied embeddings: the table is the lm_head
bos_token_id = 128000
ordinary_vocab = 128000
gguf_dir = "${BC_DATA}/models/llama32_1b"
gguf = { bf16 = "llama32-1b-instruct-bf16.gguf", q8_0 = "llama32-1b-instruct-q8_0.gguf" }
w8a8_dir = "${BC_DATA}/models/llama32_1b/w8a8-rtn"
primary = false

# ---------------------------------------------------------------------------
# Arms = backend + weight representation. Ratios are formed only inside a
# `pair` (same precision class):
#   pair "bf16": vllm-bf16  vs llamacpp-bf16  (identical BF16 weights)
#   pair "int8": vllm-w8a8  vs llamacpp-q8_0  (int8 weights x int8 activations, RTN
#                from the same BF16 snapshot; scale granularity differs, see
#                scripts/quantize_w8a8.py)
# ---------------------------------------------------------------------------
[arms.vllm-bf16]
backend = "vllm"
pair = "bf16"
precision = "bf16"
weights = "safetensors bf16 (HF snapshot)"
kv_cache_dtype = "bf16"
amx_expected = true

[arms.llamacpp-bf16]
backend = "llamacpp"
pair = "bf16"
precision = "bf16"
weights = "gguf bf16 (converted from the same snapshot, lossless)"
gguf_variant = "bf16"
build = "amx"                    # AMX build; BF16 weights still run AVX-512-BF16 kernels
kv_cache_dtype = "f16"           # overridden by [tuned.llamacpp] if tuning picks bf16
amx_expected = false

[arms.llamacpp-q8_0]
backend = "llamacpp"
pair = "int8"
precision = "q8_0"
weights = "gguf q8_0 (quantized from the bf16 gguf)"
gguf_variant = "q8_0"
build = "amx"
kv_cache_dtype = "f16"
amx_expected = true

[arms.vllm-w8a8]
backend = "vllm"
pair = "int8"
precision = "w8a8"
weights = "compressed-tensors W8A8 int8 (RTN per-channel weights, dynamic per-token activations) from the same snapshot"
checkpoint = "w8a8_dir"          # model key holding the checkpoint directory (default: snapshot)
kv_cache_dtype = "bf16"
amx_expected = true              # AMX-INT8 via vLLM's CPU int8_scaled_mm kernel (check_cpu_sgl_kernel)
added = "2026-10-04"

# ---------------------------------------------------------------------------
# Workload shapes (ISL -> OSL, tokens). Prompts are token-id lists, so both
# servers receive exactly ISL tokens; ignore_eos + max_tokens fix OSL.
# ---------------------------------------------------------------------------
[workloads.decode]
isl = 128
osl = 512
label = "Decode-heavy 128->512"

[workloads.balanced]
isl = 512
osl = 512
label = "Balanced 512->512"

[workloads.prefill]
isl = 4096
osl = 128
label = "Prefill-heavy 4096->128"

[workloads.longctx]
isl = 8192
osl = 256
label = "Long context 8192->256"
# Enabled 2026-10-04 for the 8B model after the first results: with short contexts,
# batching amortizes the weight read and memory traffic FALLS as concurrency rises.
# Long contexts make KV reads (not amortized by batching) the growing term, which
# is the regime in which concurrency can raise memory-system pressure.
enabled = true

[workloads.kvdecode]
isl = 4096
osl = 1024
label = "Long-KV decode 4096->1024"
panel_note = "mostly prefill"   # shown in panel titles: ~78% of the operations are prefill (notebook 10, section 4)
# Added 2026-10-04 (8B only), after the planned shapes all showed memory traffic
# falling with concurrency: 128/512->512 amortize the weight read, and 4096->128
# and 8192->256 are prefill-dominated. Decode over a long, growing KV cache is the
# regime in which per-step traffic grows with C (KV reads are per sequence). Same
# shape as the c48-4096-1024 cell of the tiered-KV report.
enabled = true

# Shapes of published results (notebook 13), measured only in the [external_shapes] campaign. `scope = "external"`
# keeps them out of the primary workload list (registry.workloads()), so the primary notebooks do not change.
[workloads.ext1000]
isl = 1000
osl = 1000
label = "External match 1000->1000 (NVIDIA NIM)"
scope = "external"

[workloads.ext256]
isl = 256
osl = 256
label = "External match 256->256 (Lenovo LP2463)"
scope = "external"

# ---------------------------------------------------------------------------
# Experiment B: online serving, closed loop.
# ---------------------------------------------------------------------------
[online]
concurrency = [1, 2, 4, 8, 16, 32, 64]
extend_concurrency = [128, 256]  # only while the last doubling still gained >= extend_min_gain
extend_min_gain = 0.10
plateau_gain = 0.05              # stop after two consecutive doublings below this gain
repetitions = 3
waves_small_c = 3                # requests per worker when C <= 16
waves_large_c = 3                # requests per worker when C >= 32 (3: window ~2 request durations)
min_requests = 8
stagger = true                   # spread first requests over one estimated request duration
warmup_osl = 32
max_point_seconds = 14400        # projected cost above this -> point skipped and logged
ctx_margin = 64                  # extra tokens per sequence slot
seed = 20261003
port_vllm = 8000
port_llamacpp = 8080
startup_timeout_s = 1800

# ---------------------------------------------------------------------------
# Experiment A: offline engine microbenchmarks.
# ---------------------------------------------------------------------------
[offline]
batch1_repetitions = 3
vllm_prefill_iterations = 10     # vllm bench latency --output-len 1 lasts ~0.1 s; more samples
batched_sizes = [8, 32]
batched_repetitions = 3
vllm_throughput_prompts = 64     # vllm bench throughput, vLLM-only reference

# ---------------------------------------------------------------------------
# Backend settings. Defaults below are the pre-tuning starting point; the
# tuning phase (scripts/benchmark/tuning.py) feeds its choice into [tuned.*]; the
# report documents every configuration that was tried.
# ---------------------------------------------------------------------------
[backend.vllm]
image = "${BC_IMAGES}/vllm-cpu-v0.30.0.sif"
dtype = "bfloat16"
max_num_seqs = 256
max_num_batched_tokens = 4096
kv_space_headroom = 1.15         # KV pool = C * max_model_len * kv_bytes * headroom
extra_args = []
# The image presets LD_PRELOAD (tcmalloc and Intel OpenMP, which vLLM wants for performance). `apptainer --env
# LD_PRELOAD=...` REPLACES it, so anything we preload must be prepended to this value, never set alone.
image_ld_preload = "/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.so.4:/opt/venv/lib/libiomp5.so"

[backend.llamacpp]
bin_dir_amx = "${BC_LLAMACPP}/build-amx/bin"   # amx/bin holds byte-identical copies of 3 of these tools
bin_dir_avx512 = "${BC_LLAMACPP}/build-avx512/bin"
src_dir = "${BC_LLAMACPP}/src"
batch_size = 2048
ubatch_size = 512
flash_attn = "auto"
load_mode = "none"               # weights in anonymous memory, like vLLM
poll = 50
extra_args = []

# Tuning phase 2026-10-03/04 (scripts/benchmark/tuning.py, 8B, balanced 512->512, C=1 and 16,
# data/processed/tuning.csv). Rule: highest steady total tok/s at C=16 unless
# C=1 TPOT worsens by >5% vs the default. Differences below ~2.5% are within
# single-repetition noise; the rule was applied as declared anyway.
[tuned.vllm]
max_num_batched_tokens = 8192    # 445 vs 442 (4096) vs 442 (2048) tok/s; C=1 TPOT +1.5%

[tuned.llamacpp]
flash_attn = "on"                # BF16 +17%, Q8_0 +23% throughput at C=16 vs off

[tuned.llamacpp-bf16]
ubatch_size = 512                # 142.8 vs 141.6 tok/s (2048); KV bf16 -19% -> keep f16

[tuned.llamacpp-q8_0]
ubatch_size = 2048               # 231.2 vs 225.9 tok/s (512); KV bf16 -19% -> keep f16

# Tuning 2026-10-10 (job 5316476, same grid and rule): 771.1 (2048) vs 770.4 (4096) vs 768.8 (8192)
# tok/s at C=16, C=1 TPOT within 0.5%. The rule picked 2048, but with 2048-token prefill chunks the
# warm-up of 16 concurrent 8192-token prompts inflates the client's request-duration estimate
# (238 s vs ~40 s), the stagger exceeds a request and longctx C=16 had no steady window
# (campaign main-int8-v1-mnbt2048). Deviation from the rule: 8192, as for vllm-bf16, so the two
# vLLM arms differ only in precision. The grid shows no measurable throughput cost.
[tuned.vllm-w8a8]
max_num_batched_tokens = 8192

# ---------------------------------------------------------------------------
# Telemetry.
# ---------------------------------------------------------------------------
[telemetry]
interval_s = 1.0
idle_baseline_s = 10
pmu = true
uncore = "auto"                  # used only if the kernel allows system-wide uncore events

# ---------------------------------------------------------------------------
# Memory-node sensitivity (the review's Experiment A, prepared, not yet run): does the server's throughput respond to memory bandwidth?
# Same cores (socket 0), memory on node 0 (local HBM-cached DDR) vs node 1 (remote, over the socket
# interconnect, so lower bandwidth and higher latency). Each cell runs A/B/A/B (node 0, node 1, node 0,
# node 1) inside ONE job, so the ratio is formed on the same node and day; the repetitions of the
# harness (3 per point) are kept. Driver: scripts/benchmark/membind_sensitivity.py.
# ---------------------------------------------------------------------------
[membind_sensitivity]
campaign = "membind-v2"
reference_node = 0
remote_node = 1
passes = 2

[[membind_sensitivity.cells]]
name = "vllm-decode-c1"
model = "llama31_8b"
arm = "vllm-bf16"
workload = "decode"
concurrency = 1

[[membind_sensitivity.cells]]
name = "vllm-decode-c128"
model = "llama31_8b"
arm = "vllm-bf16"
workload = "decode"
concurrency = 128

[[membind_sensitivity.cells]]
name = "vllm-kvdecode-c32"
model = "llama31_8b"
arm = "vllm-bf16"
workload = "kvdecode"
concurrency = 32

[[membind_sensitivity.cells]]
name = "llamacpp-decode-c1"          # control: bandwidth-bound single-stream decode in the other engine
model = "llama31_8b"
arm = "llamacpp-bf16"
workload = "decode"
concurrency = 1

# ---------------------------------------------------------------------------
# AMX ablations (review tasks T3.1, T3.2; driver scripts/benchmark/amx_ablation.py).
# T3.1: is AMX the reason vLLM scales? vLLM BF16 with AMX allowed, with oneDNN capped below AMX, and with every AMX
#       path off (oneDNN capped + torch reporting no AMX, which moves vLLM's own attention and small-weight kernels
#       to AVX-512). Each level is a full concurrency sweep, so the curves with and without AMX can be compared.
# T3.2: is llama.cpp's AMX path effective? llama-bench prompt processing of Q8_0 with the AMX build and with the
#       AVX-512 build (configured identically with GGML_AMX_* off), A/B/A/B inside one job.
# ---------------------------------------------------------------------------
[amx_ablation]
shim_dir = "${BC_DATA}/shim/no_amx"      # holds sitecustomize.py (copied there by `submit.sh build-shim`)

[amx_ablation.vllm]
campaign = "amx-ablation"
model = "llama31_8b"
arm = "vllm-bf16"
workloads = ["balanced", "decode"]
concurrency = [1, 2, 4, 8, 16, 32, 64]

[amx_ablation.vllm.levels.amx]            # reference, same nodes and days as the other levels
container_env = {}

[amx_ablation.vllm.levels.noamx_gemm]     # the review's setting: oneDNN GEMMs capped below AMX
container_env = { ONEDNN_MAX_CPU_ISA = "AVX512_CORE_BF16" }

[amx_ablation.vllm.levels.noamx_all]      # plus vLLM's own AMX kernels off (torch reports no AMX)
container_env = { ONEDNN_MAX_CPU_ISA = "AVX512_CORE_BF16", BC_FORCE_NO_AMX = "1", PYTHONPATH = "${BC_DATA}/shim/no_amx" }

[amx_ablation.vllm.verify]                # short points that prove what each level runs (AMX_BUSY, oneDNN dispatch)
campaign = "amx-ablation-verify"
workload = "balanced"
concurrency = [1, 8]
onednn_verbose = "profile_create"         # one line per created primitive, with the implementation (e.g. brg:avx10_1_512_amx)

[amx_ablation.llamacpp]
campaign = "amx-build"
model = "llama31_8b"
arm = "llamacpp-q8_0"
workloads = ["decode", "balanced", "prefill", "longctx"]
builds = ["amx", "avx512"]
passes = 2
tests = "pp"                              # llama-bench prompt processing only

# ---------------------------------------------------------------------------
# External-reference shapes (notebook 13; driver scripts/benchmark/external_shapes.py). No primary shape matches a
# published Llama-3.1-8B result, so every pair of notebook 13 was grade B or C. Two published sweeps are re-measured at
# exactly their shape and concurrencies with the primary harness and layout (fixed concurrency list, no adaptivity,
# 3 repetitions): NVIDIA NIM 1000->1000 (H100/H200/L40S; C = 150-250 lie beyond our sweep) and Lenovo LP2463
# 256->256 (vLLM CPU on Xeon 6). One job per (arm, workload). Each phase records the node's Slurm ConsumedEnergy
# (IPMI DCMI, whole node, 60 s updates), so notebook 13 can replace its 350 W placeholder. Not part of the primary
# analysis.
# ---------------------------------------------------------------------------
[external_shapes]
campaign = "external-shapes"
model = "llama31_8b"
arms = ["vllm-bf16"]                     # default of `submit.sh external-shapes`
optional_arms = ["vllm-w8a8"]            # `submit.sh external-shapes vllm-w8a8`: an INT8 counterpart of NIM's FP8 rows (grade B, not A)

[[external_shapes.cells]]
workload = "ext1000"
source_id = "nvidia_nim"
concurrency = [1, 5, 25, 50, 100, 128]
time_limit = "10:00:00"                  # ~3.5 h projected from the BF16 balanced/decode sweeps of `main`

[[external_shapes.cells]]
workload = "ext256"
source_id = "lenovo_lp2463"
concurrency = [1, 2, 4, 8, 16, 32, 64, 128]
time_limit = "04:00:00"                  # ~1.5 h projected
