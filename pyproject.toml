[project]
name = "llm-backend-analysis"
version = "0.2.0"
description = "Backend selection for HBM-aware LLM inference on Intel Xeon Max: vLLM vs llama.cpp (processing, analysis and figures; runs locally, not on the cluster)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "scipy>=1.13",
  "plotly>=5.22,<6",
  "kaleido==0.2.1",
  "nbformat>=5.10",
  "nbconvert>=7.16",
  "ipykernel>=6.29",
  "jupyter>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_backend_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
