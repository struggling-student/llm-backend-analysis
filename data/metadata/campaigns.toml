# Every campaign directory under data/raw/<kind>/<campaign>/ and what it may be used for.
#
# role:
#   primary     the measurements the backend-selection analysis is built on
#   tuning      backend tuning phase (feeds configs/experiment.toml [tuned.*])
#   sensitivity run to test how a result responds to a hardware condition (memory-node sensitivity);
#               never part of the primary analysis
#   validation  checks of the method itself (instrument overhead, quality, smoke runs)
#   superseded  an earlier attempt replaced by a later campaign; kept for provenance
#   failed      an attempt that did not produce usable measurements
#
# # and fails once data exist while the flag is still set). No campaign carries it at the moment.
#
# Processing reads every campaign (nothing is silently dropped) and stamps each row
# with its campaign and role; the notebooks select campaigns explicitly by role.
# A campaign directory that is missing here makes `make validate` fail.

schema_version = 1

[online.main]
role = "primary"
description = "Experiment B: online closed-loop serving, concurrency sweeps, 3 repetitions per point (2026-10-03/04)."

[online.tuning]
role = "tuning"
description = "Backend tuning grid, 8B balanced 512->512 at C=1 and C=16, 1 repetition, after the client fix."

[online.pmu-overhead]
role = "validation"
description = "A/B/A/B check of the final 5-event PMU set (telemetry on/off), 1B balanced C=1."

[online.smoke]
role = "validation"
description = "End-to-end validation matrix before the campaign (1 repetition)."

[online.smoke-staging]
role = "validation"
description = "Validation of node-local model staging after the Lustre stall (8B)."

[online.main-v0-lustre-stall]
role = "failed"
description = "First campaign attempt."
reason = "Five jobs loaded the same 16 GB from the shared Lustre pool; vLLM startup stalled > 25 min. Models are staged to node-local NVMe since."

[online.tuning-v1-queue-bug]
role = "superseded"
description = "First tuning run."
reason = "Client bug: workers pulled from a shared queue and the steady window collapsed. Fixed (per-worker request sets) and tuning re-run as `tuning`."

[online.pmu-overhead-v1-7events]
role = "superseded"
description = "Overhead check of the first 7-event PMU set."
reason = "Two multiplexed events slowed vLLM decode by ~4.5%; replaced by the 5-event set checked in `pmu-overhead`."

[online.main-int8-v1-mnbt2048]
role = "superseded"
description = "First vLLM W8A8 campaign (8B, 5 workloads), max_num_batched_tokens = 2048 as picked by the tuning rule (2026-10-10)."
reason = "With 2048-token prefill chunks the warm-up overestimated the longctx C=16 request duration (238 s vs ~40 s); the stagger left no steady window and the sweep stopped. Re-run as `main` with 8192, as for vllm-bf16 (configs/experiment.toml [tuned.vllm-w8a8])."

[online.membind]
role = "superseded"
reason = "The vLLM arms ran remote-memory points with LD_PRELOAD replaced by the NUMA shim alone, so the image's own preload (tcmalloc, Intel OpenMP) was missing (vLLM warns `libiomp is not found in LD_PRELOAD`); their remote ÷ local ratios are confounded by that, not only by the memory node. Re-run in full as `membind-v2` with the image preload kept. The llama.cpp control of this campaign is valid and unaffected."
description = "Memory-node sensitivity (review Experiment A, jobs 5384351-5384353 for vLLM, 5384324 for llama.cpp): server memory on node 0 vs remote node 1, same cores, A/B/A/B per cell inside one job (configs/experiment.toml [membind_sensitivity]). Arm directories <arm>__mem<node>_p<pass>. Not part of the primary analysis."

[online.membind-v2]
role = "sensitivity"
description = "Memory-node sensitivity (review Experiment A), corrected re-run of all four cells: shim plus the image's own LD_PRELOAD kept, placement and preload checks per point. Arm directories <arm>__mem<node>_p<pass>. Not part of the primary analysis."

[online.membind-v1-vllm-numa-override]
role = "superseded"
description = "First attempt of the memory-node sensitivity runs, vLLM BF16 arms only (decode C=1, C=128, 4096->1024 C=32 partial; jobs 5384321-5384323)."
reason = "vLLM's CPU worker resets the memory policy to the node of its first core, so numactl --membind=1 left 90-93% of the server's memory on node 0 (numastat check: 10% and 7% on node 1). Re-run as `membind` with the LD_PRELOAD shim (>= 99.99% on node 1 in `membind-shimcheck`). The llama.cpp control of the first attempt is valid (100% on node 1) and stays in `membind`."

[online.membind-shimcheck]
role = "validation"
description = "Check that the LD_PRELOAD shim (scripts/benchmark/numa_noop.c) keeps vLLM's memory on node 1: one short C=1 decode point, numastat share >= 90% on node 1."

[online.amx-ablation]
role = "sensitivity"
description = "T3.1: vLLM BF16 concurrency sweeps (balanced 512->512, decode 128->512, C = 1..64) with AMX allowed (`amx`), oneDNN capped at AVX512_CORE_BF16 (`noamx_gemm`) and every AMX path off (`noamx_all`); arm directories vllm-bf16__<level>. configs/experiment.toml [amx_ablation]. Not part of the primary analysis."

[online.amx-ablation-verify]
role = "validation"
description = "T3.1: short C = 1 and C = 8 points per ablation level with ONEDNN_VERBOSE=profile_create; amx_verify.json holds AMX_BUSY and the oneDNN implementations created (verbose lines removed from server.log)."

[offline.amx-build]
role = "sensitivity"
description = "T3.2: llama-bench prompt processing of llama.cpp Q8_0 (8B) with the AMX build and the AVX-512 build (GGML_AMX_* off, otherwise identical), A/B/A/B in one job; arm directories llamacpp-q8_0__<build>_p<pass>."

[offline.main]
role = "primary"
description = "Experiment A: offline engine microbenchmarks (llama-bench, llama-batched-bench, vllm bench latency/throughput)."

[offline.smoke]
role = "validation"
description = "Offline smoke run, 1B balanced only."

[offline.main-int8-v1-mnbt2048]
role = "superseded"
description = "First vLLM W8A8 offline job (8B), max_num_batched_tokens = 2048; cancelled during the prefill workload."
reason = "Replaced together with online `main-int8-v1-mnbt2048`; re-run as `main` with 8192."

[stream.calibration]
role = "primary"
description = "Experiment 0: STREAM triad 4-96 GiB on the server layout under the same telemetry; sustainable-bandwidth baseline and PMU-proxy validation."

[stream.calibration-membind1]
role = "sensitivity"
description = "Memory-node sensitivity (review Experiment A; job 5384320, 2026-10-16): STREAM triad with memory on node 1 (remote), 55 threads, same PMU counters; the roof for the remote-memory cells."

[stream.calibration-v1-7events]
role = "superseded"
description = "Calibration with the first 7-event PMU set."
reason = "Replaced by the 5-event set used in every campaign run."

[hardware.cache-20260921T173410Z]
role = "primary"
description = "Hardware compute ceilings from the hw-bench roofline study (2026-09-21, cache-mode node cresco8-hbm15): one socket, 56 threads, AVX-512 FP32/FP64 FMA, AMX INT8 tile peak, oneDNN AMX BF16 GEMM 6144^3. Subset synced: compute/single-socket*-t56-* and system/. Roofline compute roofs (notebook 10)."

[hardware.gemm-ceilings-20261011]
role = "primary"
description = "GEMM ceilings on the server layout (Slurm job 5317636, scripts/benchmark/gemm_ceilings.py as committed in 7513b80): 55 threads on cores 0-54, membind 0, inside vllm-cpu-v0.30.0.sif. oneDNN BF16 (torch.mm) and INT8 (torch._int_mm) 6144^3, and vLLM's own projection kernels (onednn_mm BF16, int8_scaled_mm_with_quant and onednn_scaled_mm W8A8) at the Llama-3.1-8B projection shapes, M = 512/2048/8192; affinity mask only and vLLM-style KMP pinning; 3 repetitions. Gives the measured AMX INT8 GEMM roof (notebook 10)."

[quality.quality]
role = "validation"
description = "INT8 quality/AMX sanity check: 16 prompts x 64 greedy tokens for all four arms, 8B, on a cresco8_cpu node (Xeon Platinum 8592+, not Xeon Max)."
